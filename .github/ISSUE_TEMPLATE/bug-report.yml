name: Bug report
description: Something is actually broken. Wrong output, a crash, or silent failure.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the tool did the wrong thing. If it worked but irritated you, file "Something annoyed me while using it" instead.

  - type: input
    id: version
    attributes:
      label: Version
      description: The version from CHANGELOG.md, or the commit SHA if you have not tagged one yet.
      placeholder: 0.2.0
    validations:
      required: true

  - type: textarea
    id: what-i-ran
    attributes:
      label: What I ran
      description: The exact command, click, or input. Copy it, do not retype it from memory.
      render: shell
      placeholder: rename-shots ~/Desktop --dry-run
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual output, including the error, if there was one. A silent success that did nothing counts and is worth saying so explicitly.
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-i-expected
    attributes:
      label: What I expected
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and the runtime version, if it is relevant.
      placeholder: macOS 15.3, Python 3.13
    validations:
      required: false

  - type: checkboxes
    id: signal
    attributes:
      label: Before you close this
      options:
        - label: This is the second time this has broken, so I am adding a test rather than only a fix
          required: false
        - label: I will reference the fixing commit when I close this issue
          required: false
